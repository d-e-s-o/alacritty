[workspace]
members = [
    "alacritty",
    "alacritty_terminal",
    "alacritty_config",
    "alacritty_config_derive",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85.0"

[profile.release]
lto = "thin"
debug = 1
incremental = false

[workspace.dependencies]
toml = "0.9.2"
toml_edit = "0.23.1"

[patch.crates-io]
x11-clipboard = { git = "https://github.com/d-e-s-o/x11-clipboard.git", rev = "442be17509f5987ea0f75543b017ddb5efed09d1" }
